[project]
name = "agents-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed Almatry", email = "moalmatry2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.31.0",
    "langchain>=1.4.9",
    "langchain-google-genai>=4.4.3",
    "litellm>=1.108.3",
    "numpy>=2.5.4",
    "openai>=3.48.0",
    "python-dotenv>=1.2.4",
]

[tool.pyright]
typeCheckingMode = "off"

[project.scripts]
agents-test = "agents_test:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
